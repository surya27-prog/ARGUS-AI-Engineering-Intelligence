[project]
name = "argus-backend"
version = "0.1.0"
description = "ARGUS backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # Required by FastAPI to accept the multipart zip upload on POST /repos/upload.
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags function calls in argument defaults, which is exactly how FastAPI
# declares dependencies (`db: Session = Depends(get_db)`).
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
