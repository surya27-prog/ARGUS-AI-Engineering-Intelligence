[project]
name = "argus-backend"
version = "0.1.0"
description = "ARGUS backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "neo4j>=5.26",
    # Required by FastAPI to accept the multipart zip upload on POST /repos/upload.
    "python-multipart>=0.0.20",
    "anthropic>=0.122.0",
    "openai>=3.1.0",
    "qdrant-client>=1.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags function calls in argument defaults, which is exactly how FastAPI
# declares dependencies (`db: Session = Depends(get_db)`).
ignore = ["B008"]

[tool.ruff.lint.isort]
# `parser` is the sibling package in this repo, not the long-dead stdlib module
# of the same name. Grouping it with `app` also keeps it sorted *after* `app`,
# which matters: the path bootstrap that makes it importable lives in
# `app/services/__init__.py`.
known-first-party = ["app", "parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
